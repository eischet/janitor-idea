[versions]
# main lib
janitor = "0.9.42"

# libraries
antlr = "4.13.1"
junit = "4.13.2"
opentest4j = "1.3.0"

# plugins
changelog = "2.5.0"
intelliJPlatform = "2.10.5"
kotlin = "2.2.21"
kover = "0.9.4"
qodana = "2025.2.2"

[libraries]
antlr = { group = "org.antlr", name = "antlr4", version.ref = "antlr" }
antlrRuntime = { group = "org.antlr", name = "antlr4-runtime", version.ref = "antlr" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
opentest4j = { group = "org.opentest4j", name = "opentest4j", version.ref = "opentest4j" }
janitorRepl = { group = "com.eischet.janitor", "name" = "janitor-repl", version.ref = "janitor" }

[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
qodana = { id = "org.jetbrains.qodana", version.ref = "qodana" }
